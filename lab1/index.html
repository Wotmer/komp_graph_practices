<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Лабораторная 1 — Цветовые модели</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f3f8;color:#17233c;font:16px system-ui,sans-serif}main{max-width:1200px;margin:36px auto;padding:0 24px}header{display:flex;align-items:center;justify-content:space-between;gap:24px}h1{font-size:36px;letter-spacing:-1.5px;margin:8px 0}h2{margin:0;font-size:23px}p{line-height:1.55}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;color:#586781}select,button,input{font:inherit}select,button{border:1px solid #c9d1df;border-radius:10px;padding:10px;background:white;color:#17233c}button{cursor:pointer}button:hover{border-color:#416be3}.overview{display:grid;grid-template-columns:1fr 1.5fr;gap:24px;margin:24px 0}.preview{min-height:190px;border-radius:20px;background:#4275df;display:flex;align-items:end;padding:24px}.badge{padding:9px 14px;border-radius:9px;background:white;color:#17233c;font:700 20px monospace}.tools,.card{background:#fff;border:1px solid #dee3ed;border-radius:20px;padding:24px}.tools p{margin-top:0;color:#52617b}.swatches{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.swatch{width:32px;height:32px;border:1px solid #9ba6b5;border-radius:50%;padding:0}.hexrow{display:flex;gap:10px;align-items:center}.hexrow input{width:130px;padding:9px;border:1px solid #b8c2d4;border-radius:8px}.models{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.subtitle{font-size:13px;color:#5c6a80;margin:7px 0 20px;min-height:38px}.row{margin:18px 0}.rowtop{display:flex;justify-content:space-between;align-items:center;gap:8px}.row label{font-size:14px}.number{width:89px;border:1px solid #b9c3d4;border-radius:7px;padding:6px;text-align:right}.range{width:100%;accent-color:#456cdd;margin-top:12px}.picker{display:flex;align-items:center;gap:12px;padding-top:16px;border-top:1px solid #e6e9f0;font-size:14px}.picker input{width:50px;height:35px;padding:2px;border:1px solid #c9d1df;border-radius:6px;background:white;cursor:pointer}footer{font-size:13px;color:#52617b;margin:24px 0}.error{color:#af2442;min-height:24px;font-size:13px;margin-top:8px}input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #8aacf7;outline-offset:2px}@media(max-width:850px){.models{grid-template-columns:1fr}.overview{grid-template-columns:1fr}header{align-items:start;flex-direction:column}main{margin-top:24px}h1{font-size:30px}.subtitle{min-height:0}}
</style>
<main><header><div><div class="eyebrow">ЛАБОРАТОРНАЯ РАБОТА 01</div><h1>Цветовые модели</h1></div><label>Вариант <select id="variant"><option value="HSV">Чётный · CMYK / RGB / HSV</option><option value="HLS" selected>Нечётный · CMYK / RGB / HLS</option></select></label></header>
<section class="overview"><div class="preview" id="preview" role="img" aria-label="Выбранный цвет"><span class="badge" id="badge"></span></div><div class="tools"><p>Один цвет — три представления. Измените любую компоненту или выберите цвет из палитры.</p><div class="hexrow"><label for="hex">HEX</label><input id="hex" maxlength="7" spellcheck="false" aria-describedby="error"><button id="reset">Сбросить</button></div><div class="error" id="error" role="status"></div><div class="swatches" id="swatches" aria-label="Готовые цвета"></div></div></section><section class="models" id="models"></section><footer>RGB: 0–255 · H: 0–360° · остальные компоненты: 0–100%. HLS соответствует HSL с порядком H, L, S. CMYK рассчитана по учебной формуле без ICC-профиля.</footer></main>
<script src="color.js"></script><script>
const $=id=>document.getElementById(id);let rgb=[66,117,223],state={},mode='HLS';
const specs={RGB:[['R','Красный',255],['G','Зелёный',255],['B','Синий',255]],CMYK:[['C','Голубой',100],['M','Пурпурный',100],['Y','Жёлтый',100],['K','Чёрный',100]],HSV:[['H','Тон',360],['S','Насыщенность',100],['V','Яркость',100]],HLS:[['H','Тон',360],['L','Светлота',100],['S','Насыщенность',100]]};
const desc={RGB:'Аддитивная модель света',CMYK:'Субтрактивная модель красок',HSV:'Тон, насыщенность, яркость',HLS:'Тон, светлота, насыщенность'};
const toRgb={RGB:a=>a.slice(),CMYK:Color.cmykToRgb,HSV:Color.hsvToRgb,HLS:Color.hlsToRgb};
function hexOf(a){return '#'+a.map(x=>Math.round(Math.min(255,Math.max(0,x))).toString(16).padStart(2,'0')).join('').toUpperCase();}
function render(source,values){state={RGB:rgb.slice(),CMYK:Color.rgbToCmyk(rgb),HSV:Color.rgbToHsv(rgb),HLS:Color.rgbToHls(rgb)};if(source)state[source]=values.slice();const hex=hexOf(rgb);$('preview').style.background=hex;$('preview').setAttribute('aria-label','Выбранный цвет '+hex);$('badge').textContent=hex;$('hex').value=hex;document.querySelectorAll('.palette').forEach(e=>e.value=hex);for(const model of ['CMYK','RGB',mode])state[model].forEach((v,i)=>{const n=$(`${model}-${i}`),r=$(`${model}-r-${i}`);n.value=Number(v.toFixed(3));r.value=v;});}
function update(model,i,input){const x=Number(input.value),max=specs[model][i][2];if(input.value.trim()===''||!Number.isFinite(x)||x<0||x>max){$('error').textContent=`Допустимый диапазон: 0–${max}.`;input.setAttribute('aria-invalid','true');return;}document.querySelectorAll('[aria-invalid]').forEach(e=>e.removeAttribute('aria-invalid'));$('error').textContent='';const values=state[model].slice();values[i]=x;rgb=toRgb[model](values);render(model,values);}
function build(){ $('models').replaceChildren();for(const model of ['CMYK','RGB',mode]){const card=document.createElement('article');card.className='card';card.innerHTML=`<h2>${model}</h2><p class="subtitle">${desc[model]}</p>`;specs[model].forEach(([key,label,max],i)=>{const row=document.createElement('div');row.className='row';row.innerHTML=`<div class="rowtop"><label for="${model}-${i}"><b>${key}</b> · ${label}</label><input class="number" id="${model}-${i}" type="number" min="0" max="${max}" step="any" aria-label="${model} ${label}"></div><input class="range" id="${model}-r-${i}" aria-label="${model} ${label} ползунок" type="range" min="0" max="${max}" step="0.01">`;card.append(row);row.querySelector('.number').addEventListener('input',e=>update(model,i,e.target));row.querySelector('.number').addEventListener('blur',()=>{render(model,state[model]);$('error').textContent='';row.querySelector('.number').removeAttribute('aria-invalid');});row.querySelector('.range').addEventListener('input',e=>update(model,i,e.target));});const picker=document.createElement('label');picker.className='picker';picker.innerHTML=`<input class="palette" type="color" aria-label="Палитра ${model}">Выбрать из палитры`;picker.querySelector('input').addEventListener('input',e=>setHex(e.target.value));card.append(picker);$('models').append(card);}render();}
function setHex(hex){rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));$('error').textContent='';render();}
$('hex').addEventListener('input',e=>{const hex=e.target.value.trim();if(/^#?[0-9a-f]{6}$/i.test(hex)){setHex(hex.startsWith('#')?hex:'#'+hex);}else $('error').textContent='Введите 6 шестнадцатеричных цифр, например #4275DF.';});
$('variant').addEventListener('change',e=>{mode=e.target.value;$('error').textContent='';build();});$('reset').addEventListener('click',()=>setHex('#4275DF'));
for(const hex of ['#000000','#FFFFFF','#808080','#FF0000','#00FF00','#0000FF','#00FFFF','#FF00FF','#FFFF00','#4275DF']){const b=document.createElement('button');b.className='swatch';b.style.background=hex;b.title=hex;b.setAttribute('aria-label','Выбрать '+hex);b.onclick=()=>setHex(hex);$('swatches').append(b);}build();
</script></html>
